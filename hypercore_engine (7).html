            const submit = () => {
                if (!idea.trim()) return;
                onGenerate({
                    idea: idea.trim(),
                    complexity,
                    style,
                    paramHints: paramHints.trim(),
                    extraInstructions: extraInstructions.trim(),
                    includeComments,
                    responsive
                });
            };

            return (
                <div className="fixed inset-0 modal-backdrop z-[150] flex items-center justify-center p-4 fade-in font-sans">
                    <div className="bg-[#0a0c10] border border-[#67e8f9]/40 rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div className="p-5 border-b border-[rgba(0,229,255,0.20)] flex items-center justify-between sticky top-0 bg-[#0a0c10] z-10">
                            <h3 className="text-sm font-black uppercase tracking-widest text-white flex items-center gap-2">
                                <Icon name="sparkles" size={16} className="text-[#67e8f9]" />
                                Gemini Prompt Engine
                                <span className="text-[9px] bg-[#00e5ff]/30 border border-[#00e5ff]/60 text-[#67e8f9] px-2 py-0.5 rounded">{activeType}</span>
                            </h3>
                            <button onClick={onClose} disabled={busy} className="text-gray-500 hover:text-white disabled:opacity-30"><Icon name="x" size={20} /></button>
                        </div>

                        <div className="p-6 space-y-5">
                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2 flex items-center justify-between">
                                    <span>Describe Your Module</span>
                                    <span className="text-[9px] text-gray-600 normal-case tracking-normal">Be specific — purpose, behavior, look & feel</span>
                                </label>
                                <textarea
                                    value={idea}
                                    onChange={(e) => setIdea(e.target.value)}
                                    placeholder={`e.g. A ${activeType.toLowerCase()} module that…`}
                                    spellCheck={false}
                                    className="w-full h-28 bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#67e8f9] rounded-lg px-3 py-2 text-sm text-white outline-none resize-y"
                                />
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Quick Presets</label>
                                <div className="flex flex-wrap gap-2">
                                    {(presets[activeType] || []).map(p => (
                                        <button
                                            key={p}
                                            onClick={() => setIdea(p)}
                                            disabled={busy}
                                            className="text-[10px] bg-black border border-[rgba(0,229,255,0.20)] hover:border-[#67e8f9] hover:text-[#67e8f9] text-gray-400 px-2.5 py-1 rounded-md transition-colors disabled:opacity-40"
                                        >
                                            {p}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Complexity</label>
                                    <select
                                        value={complexity}
                                        onChange={(e) => setComplexity(e.target.value)}
                                        className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#67e8f9] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                    >
                                        <option>Minimal</option>
                                        <option>Standard</option>
                                        <option>Advanced</option>
                                        <option>Production-grade</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Visual / Tonal Style</label>
                                    <select
                                        value={style}
                                        onChange={(e) => setStyle(e.target.value)}
                                        className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#67e8f9] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                    >
                                        <option>Cyberpunk / Dark</option>
                                        <option>Minimal / Clean</option>
                                        <option>Glassmorphism</option>
                                        <option>Brutalist</option>
                                        <option>Corporate / Professional</option>
                                        <option>Playful / Colorful</option>
                                        <option>Neutral (no styling bias)</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2 flex items-center justify-between">
                                    <span>Parameter Hints (optional)</span>
                                    <span className="text-[9px] text-gray-600 normal-case tracking-normal">Comma-separated, become <code className="text-[#67e8f9]">{`{{params}}`}</code></span>
                                </label>
                                <input
                                    value={paramHints}
                                    onChange={(e) => setParamHints(e.target.value)}
                                    placeholder="e.g. title, subtitle, ctaLabel, iconName"
                                    className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#67e8f9] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                />
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Extra Instructions (optional)</label>
                                <textarea
                                    value={extraInstructions}
                                    onChange={(e) => setExtraInstructions(e.target.value)}
                                    placeholder="Constraints, frameworks to use/avoid, accessibility requirements, edge cases…"
                                    className="w-full h-20 bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#67e8f9] rounded-lg px-3 py-2 text-xs text-white outline-none resize-y"
                                />
                            </div>

                            <div className="flex flex-wrap items-center gap-4 pt-2 border-t border-[rgba(0,229,255,0.20)]/60">
                                <label className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-gray-400 cursor-pointer">
                                    <input type="checkbox" checked={includeComments} onChange={(e) => setIncludeComments(e.target.checked)} className="accent-[#00e5ff]" />
                                    Include inline comments
                                </label>
                                <label className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-gray-400 cursor-pointer">
                                    <input type="checkbox" checked={responsive} onChange={(e) => setResponsive(e.target.checked)} className="accent-[#00e5ff]" />
                                    Responsive / mobile-friendly
                                </label>
                            </div>
                        </div>

                        <div className="p-5 border-t border-[rgba(0,229,255,0.20)] flex items-center justify-between sticky bottom-0 bg-[#0a0c10] z-10 font-sans">
                            <div className="text-[10px] text-gray-600 uppercase tracking-widest flex items-center gap-2 mono">
                                <Icon name="zap" size={11} className="text-[#67e8f9]" />
                                Powered by Gemini · Output is parameterized & reusable
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={onClose} disabled={busy} className="text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-white px-4 py-2 disabled:opacity-40">Cancel</button>
                                <button
                                    onClick={submit}
                                    disabled={busy || !idea.trim()}
                                    className="bg-[#0891b2] hover:bg-[#00e5ff] disabled:opacity-40 disabled:cursor-not-allowed text-white px-5 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2"
                                >
                                    {busy ? <><Icon name="loader" size={12} /> Generating…</> : <><Icon name="sparkles" size={12} /> Generate Module</>}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== COMPONENT: MODULE BUILDER =====
        function ModuleBuilder({ modules, setModules, showToast, applyAICode, setActiveTab, code, triggerConfirmation }) {
            const [activeType, setActiveType] = useState('UI');
            const [search, setSearch] = useState('');
            const [editorModule, setEditorModule] = useState(null);
            const [instantiateModule, setInstantiateModule] = useState(null);
            const [aiBusy, setAiBusy] = useState(false);
            const [showAIModal, setShowAIModal] = useState(false);
            const importInputRef = useRef(null);

            const allTypes = ['UI', 'LOGIC', 'AI-PROMPT', 'LAYOUT', 'ANIMATION', 'DATA'];

            const filtered = useMemo(() => {
                let list = modules.filter(m => m.type === activeType);
                if (search.trim()) {
                    const q = search.toLowerCase();
                    list = list.filter(m =>
                        m.name?.toLowerCase().includes(q) ||
                        m.description?.toLowerCase().includes(q) ||
                        (m.tags || []).some(t => t.includes(q)) ||
                        m.content?.toLowerCase().includes(q)
                    );
                }
                return list.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
            }, [modules, activeType, search]);

            const newBlankModule = () => {
                const blank = {
                    id: 'new_' + Date.now(),
                    type: activeType,
                    name: '',
                    description: '',
                    content: activeType === 'UI'
                        ? '<div class="p-4 bg-gradient-to-r from-blue-900 to-black rounded-lg border border-[#0047ab]"><h4>{{title}}</h4></div>'
                        : activeType === 'LOGIC'
                            ? '// {{description}}\nconsole.log("Module loaded");'
                            : activeType === 'AI-PROMPT'
                                ? 'You are an agent that {{role}}. When asked, you should {{behavior}}.'
                                : '',
                    tags: [],
                    params: [],
                    createdAt: Date.now()
                };
                setEditorModule(blank);
            };

            const saveModule = (mod) => {
                const finalId = mod.id?.startsWith('new_') ? 'm_' + Date.now() : mod.id;
                const saved = { ...mod, id: finalId };
                setModules(prev => {
                    const exists = prev.some(m => m.id === finalId);
                    if (exists) return prev.map(m => m.id === finalId ? saved : m);
                    return [saved, ...prev];
                });
                showToast(`Module "${saved.name}" saved.`);
            };

            const deleteModule = (id) => {
                setModules(prev => prev.filter(m => m.id !== id));
                showToast('Module deleted');
            };

            const duplicateModule = (m) => {
                const copy = { ...m, id: 'm_' + Date.now(), name: m.name + ' (copy)', createdAt: Date.now() };
                setModules(prev => [copy, ...prev]);
                showToast(`Duplicated "${m.name}"`);
            };

            const injectToIDE = (content) => {
                applyAICode(prevCode => (prevCode || '') + '\n' + content, 'Module injected to IDE');
                showToast("Module code appended to workspace buffer.");
                setActiveTab('ide');
            };

            const handleInject = (m) => {
                if (m.params && m.params.length > 0) {
                    setInstantiateModule(m);
                } else {
                    injectToIDE(m.content);
                }
            };

            const exportModules = () => {
                const data = JSON.stringify({ exportedAt: Date.now(), version: STORAGE_VERSION, modules }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `hypercore_modules_${Date.now()}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Modules exported');
            };

            const importModules = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        const incoming = Array.isArray(data) ? data : (data.modules || []);
                        if (!incoming.length) { showToast('No modules found in file'); return; }
                        const fresh = incoming.map((m, i) => ({ ...m, id: 'm_imp_' + Date.now() + '_' + i }));
                        setModules(prev => [...fresh, ...prev]);
                        showToast(`Imported ${fresh.length} modules`);
                    } catch (err) {
                        showToast('Invalid module file');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const aiGenerateModule = async (cfg) => {
                const idea = (cfg && cfg.idea) || '';
                if (!idea) return;
                setAiBusy(true);
                showToast('Generating module with Gemini…');
                try {
                    const styleLine = cfg.style && cfg.style !== 'Neutral (no styling bias)'
                        ? `Visual/tonal style: ${cfg.style}.`
                        : 'No strong stylistic bias — keep it neutral and easy to restyle.';
                    const complexityLine = `Complexity target: ${cfg.complexity || 'Standard'}.`;
                    const paramLine = cfg.paramHints
                        ? `Use these as {{placeholders}} where they make sense: ${cfg.paramHints}.`
                        : 'Choose sensible {{placeholders}} for the most likely customization points.';
                    const commentLine = cfg.includeComments
                        ? 'Include short inline comments explaining key parts.'
                        : 'Keep the code clean with minimal comments.';
                    const responsiveLine = cfg.responsive && (activeType === 'UI' || activeType === 'LAYOUT')
                        ? 'Must be responsive and mobile-friendly using Tailwind-style utility classes.'
                        : '';
                    const extra = cfg.extraInstructions ? `Additional requirements: ${cfg.extraInstructions}` : '';

                    const sys = `You are the Hypercore Module Factory. Generate a single REUSABLE ${activeType} module template. Output STRICT JSON: {"name":"...","description":"...","content":"...","tags":["..."]}. The content must be a self-contained snippet and SHOULD include {{paramName}} placeholders where reusability is helpful. Do not wrap in markdown. Do not include backticks. Name should be short and descriptive (under 40 chars). Tags should be 3–6 lowercase keywords.`;

                    const userPrompt = [
                        `Create a ${activeType} module: ${idea}.`,
                        complexityLine,
                        styleLine,
                        paramLine,
                        commentLine,
                        responsiveLine,
                        extra,
                        'Make it generic, reusable, and template-parameterized with {{params}}.'
                    ].filter(Boolean).join(' ');

                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: sys }] },
                        generationConfig: {
                            responseMimeType: 'application/json',
                            responseSchema: {
                                type: 'OBJECT',
                                properties: {
                                    name: { type: 'STRING' },
                                    description: { type: 'STRING' },
                                    content: { type: 'STRING' },
                                    tags: { type: 'ARRAY', items: { type: 'STRING' } }
                                },
                                required: ['name', 'content']
                            }
                        }
                    };
                    const result = await callGeminiWithBackoff(payload, 3, 800);
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    const parsed = JSON.parse(text);
                    const params = [...new Set([...(parsed.content || '').matchAll(/\{\{(\w+)\}\}/g)].map(m => m[1]))];
                    const newMod = {
                        id: 'm_ai_' + Date.now(),
                        type: activeType,
                        name: parsed.name || idea.slice(0, 30),
                        description: parsed.description || idea,
                        content: parsed.content || '',
                        tags: parsed.tags || ['ai-generated'],
                        params,
                        createdAt: Date.now()
                    };
                    setModules(prev => [newMod, ...prev]);
                    showToast(`AI module "${newMod.name}" created`);
                    setShowAIModal(false);
                } catch (err) {
                    showToast('Module generation failed: ' + err.message);
                } finally {
                    setAiBusy(false);
                }
            };

            const extractFromIDE = () => {
                if (!code || !code.trim()) { showToast('IDE buffer is empty'); return; }
                const blank = {
                    id: 'new_' + Date.now(),
                    type: activeType,
                    name: 'Extracted from IDE',
                    description: 'Captured from the current IDE buffer.',
                    content: code,
                    tags: ['extracted'],
                    params: [],
                    createdAt: Date.now()
                };
                setEditorModule(blank);
            };

            return (
                <div className="h-full overflow-y-auto p-10 max-w-6xl mx-auto space-y-8 font-sans">
                    <div className="flex justify-between items-end flex-wrap gap-4">
                        <div>
                            <h2 className="text-3xl font-bold text-white">Module Factory</h2>
                            <p className="text-gray-500 text-sm mt-1">Reusable component blocks & logic controllers. Parameterize with <code className="text-[#67e8f9]">{`{{vars}}`}</code> for true reusability.</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <button onClick={extractFromIDE} className="bg-black border border-[rgba(0,229,255,0.20)] text-gray-300 hover:border-[#00e5ff] hover:text-white px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center gap-1" title="Snapshot current IDE buffer into a new module">
                                <Icon name="copy" size={12} /> From IDE
                            </button>
                            <button onClick={() => setShowAIModal(true)} disabled={aiBusy} className="bg-black border border-[#67e8f9]/40 text-[#67e8f9] hover:bg-[#00e5ff]/20 px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center gap-1 disabled:opacity-40" title="Open the Gemini Prompt Engine to generate a new module">
                                {aiBusy ? <Icon name="loader" size={12} /> : <Icon name="sparkles" size={12} />} AI Generate
                            </button>
                            <button onClick={exportModules} className="bg-black border border-[rgba(0,229,255,0.20)] text-gray-300 hover:border-[#00e5ff] hover:text-white px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center gap-1">
                                <Icon name="download" size={12} /> Export
                            </button>
                            <button onClick={() => importInputRef.current.click()} className="bg-black border border-[rgba(0,229,255,0.20)] text-gray-300 hover:border-[#00e5ff] hover:text-white px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center gap-1">
                                <Icon name="upload" size={12} /> Import
                            </button>
                            <input type="file" ref={importInputRef} className="hidden" accept=".json,application/json" onChange={importModules} />
                            <button onClick={newBlankModule} className="bg-[#0891b2] text-white px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-[#00e5ff] transition-all flex items-center gap-2">
                                <Icon name="plus" size={14} /> New Module
                            </button>
                        </div>
                    </div>

                    <div className="relative">
                        <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-600" />
                        <input
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            placeholder={`Search ${activeType.toLowerCase()} modules by name, tag, description, or content…`}
                            className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#00e5ff] rounded-xl pl-10 pr-4 py-2.5 text-sm text-white outline-none"
                        />
                    </div>

                    <div className="flex gap-4 border-b border-[rgba(0,229,255,0.20)] overflow-x-auto">
                        {allTypes.map(t => (
                            <button key={t} onClick={() => setActiveType(t)} className={`pb-4 text-xs font-bold uppercase tracking-widest transition-all relative whitespace-nowrap ${activeType === t ? 'text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                                {t} <span className="text-[9px] text-gray-600">({modules.filter(m => m.type === t).length})</span>
                                {activeType === t && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-[#00e5ff]" />}
                            </button>
                        ))}
                    </div>

                    {filtered.length === 0 ? (
                        <div className="text-center py-16 border border-dashed border-[rgba(0,229,255,0.20)] rounded-2xl">
                            <Icon name="layers" size={32} className="text-gray-700 mx-auto mb-3" />
                            <p className="text-gray-500 text-sm">No {activeType.toLowerCase()} modules {search ? 'match your search' : 'yet'}. Click <span className="text-[#67e8f9] font-bold">New Module</span> or <span className="text-[#67e8f9] font-bold">AI Generate</span> to create one.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {filtered.map(m => (
                                <div key={m.id} className="bg-[#0a0c10] border border-[rgba(0,229,255,0.20)] p-5 rounded-2xl hover:border-[#00e5ff] transition-all group flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="w-10 h-10 bg-black rounded-lg border border-[rgba(0,229,255,0.20)] flex items-center justify-center text-[#00e5ff]">
                                                <Icon name={m.type === 'UI' || m.type === 'LAYOUT' ? 'layers' : m.type === 'AI-PROMPT' ? 'sparkles' : m.type === 'ANIMATION' ? 'zap' : m.type === 'DATA' ? 'database' : 'terminal'} size={18} />
                                            </div>
                                            <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => duplicateModule(m)} title="Duplicate" className="text-gray-600 hover:text-[#67e8f9] p-1"><Icon name="copy" size={12} /></button>
                                                <button onClick={() => setEditorModule(m)} title="Edit" className="text-gray-600 hover:text-white p-1"><Icon name="edit" size={12} /></button>
                                                <button 
                                                    onClick={() => { 
                                                        triggerConfirmation(
                                                            'Delete Module',
                                                            `Are you sure you want to delete "${m.name}"?`,
                                                            () => deleteModule(m.id)
                                                        );
                                                    }} 
                                                    title="Delete" 
                                                    className="text-gray-700 hover:text-red-500 p-1"
                                                >
                                                    <Icon name="trash" size={12} />
                                                </button>
                                            </div>
                                        </div>
                                        <h4 className="font-bold text-white mb-1">{m.name}</h4>
                                        {m.description && <p className="text-[11px] text-gray-500 mb-2 line-clamp-2">{m.description}</p>}
                                        {(m.params || []).length > 0 && (
                                            <div className="flex gap-1 flex-wrap mb-2">
                                                {m.params.map(p => <span key={p} className="text-[9px] bg-[#00e5ff]/20 border border-[#00e5ff]/40 text-cyan-200 px-1.5 py-0.5 rounded mono">{p}</span>)}
                                            </div>
                                        )}
                                        {(m.tags || []).length > 0 && (
                                            <div className="flex gap-1 flex-wrap mb-3">
                                                {m.tags.slice(0, 4).map(t => <span key={t} className="text-[9px] bg-black border border-gray-800 text-gray-500 px-1.5 py-0.5 rounded">#{t}</span>)}
                                            </div>
                                        )}
                                        <pre className="text-[10px] text-gray-500 mono overflow-hidden whitespace-nowrap text-ellipsis max-w-full bg-black/40 p-2 rounded border border-gray-900 mb-4 mono">{(m.content || '').slice(0, 120)}</pre>
                                    </div>
                                    <button
                                        onClick={() => handleInject(m)}
                                        className="w-full py-2 bg-white/5 border border-white/10 rounded-lg text-[10px] font-bold uppercase tracking-widest text-gray-400 group-hover:text-white hover:bg-blue-950 transition-all flex items-center justify-center gap-1"
                                    >
                                        <Icon name="zap" size={12} /> {(m.params || []).length > 0 ? 'Instantiate & Inject' : 'Inject to IDE'}
                                    </button>
                                </div>
                            ))}
                        </div>
                    )}

                    {editorModule && (
                        <ModuleEditorModal
                            module={editorModule}
                            onClose={() => setEditorModule(null)}
                            onSave={saveModule}
                            onDelete={deleteModule}
                            showToast={showToast}
                            triggerConfirmation={triggerConfirmation}
                        />
                    )}
                    {instantiateModule && (
                        <InstantiateModal
                            module={instantiateModule}
                            onClose={() => setInstantiateModule(null)}
                            onInject={injectToIDE}
                            showToast={showToast}
                        />
                    )}
                    {showAIModal && (
                        <GeminiPromptEngineModal
                            activeType={activeType}
                            busy={aiBusy}
                            onClose={() => { if (!aiBusy) setShowAIModal(false); }}
                            onGenerate={aiGenerateModule}
                        />
                    )}
                </div>
            );
        }

        // ===== AUTH & SECURITY HANDSHAKE =====
        function AuthPage({ onLogin, hasVault }) {
            return (
                <div className="h-screen w-full bg-[#05070a] xray-grid flex items-center justify-center p-4 safe-x scanlines relative overflow-hidden">
                    <div className="scan-line" />
                    <div className="glass-xray skeletal-border w-full max-w-sm p-8 sm:p-10 angular-cut shadow-2xl relative overflow-hidden text-center glow-cyan">
                        <div className="absolute -top-24 -right-24 w-56 h-56 bg-cyan-500/10 blur-[80px] rounded-full pointer-events-none" />
                        <div className="mb-6 mx-auto w-16 h-16 rounded-full border border-cyan-500/40 flex items-center justify-center text-cyan-400 animate-xray">
                            <Icon name="lock" size={30} />
                        </div>
                        <h1 className="text-xl font-black text-cyan-50 tracking-[0.2em] mb-2 uppercase glow-text">HYPER<span className="text-cyan-400">CORE</span> X-RAY</h1>
                        <p className="text-[10px] text-cyan-500/70 uppercase tracking-widest mb-2">Multi-Agent Engine</p>
                        <p className="text-[9px] text-cyan-700 uppercase tracking-widest mb-7 mono">v6.9 · Skeletal Handshake Required</p>
                        <p className="text-cyan-100/40 text-xs mb-7 leading-relaxed uppercase tracking-wide">
                            Establish security handshake for sandbox environment core controllers.
                        </p>
                        {hasVault && (
                            <div className="mb-5 p-3 bg-cyan-500/5 border border-cyan-500/20 angular-cut-sm flex items-center justify-center gap-2 text-emerald-400 text-[9px] font-bold uppercase tracking-widest">
                                <Icon name="database" size={11} /> Local vault detected — projects will resume
                            </div>
                        )}
                        <button
                            onClick={onLogin}
                            className="tap-target w-full py-4 bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 text-black angular-cut text-xs font-black uppercase tracking-[0.3em] transition-all glow-cyan-strong flex items-center justify-center gap-2"
                        >
                            <Icon name="zap" size={14} /> Authorize Core
                        </button>
                        <div className="mt-6 pt-6 border-t border-cyan-500/10 text-[9px] uppercase tracking-widest text-cyan-700 mono">
                            NODE :: SANDBOX-HC // PROTOCOL 7-B
                        </div>
                    </div>
                </div>
            );
        }

        // ===== DASHBOARD & PROJECT MANAGER =====
        function DashboardPage({ projects, currentProjectId, loadProject, createProject, deleteProject, renameProject, duplicateProject, setActiveTab, codeAnalysis, modulesCount, showToast, triggerConfirmation }) {
            const [newName, setNewName] = useState('');
            const [renamingId, setRenamingId] = useState(null);
            const [renameValue, setRenameValue] = useState('');

            // NEW LLM-POWERED TEMPLATE SPAWNER STATES
            const [spawnerIdea, setSpawnerIdea] = useState('');
            const [spawnerLoading, setSpawnerLoading] = useState(false);

            const formatDate = (ts) => {
                if (!ts) return '—';
                try {
                    const d = new Date(ts);
                    return d.toLocaleString();
                } catch { return '—'; }
            };

            const handleCreate = () => {
                if (!newName.trim()) { showToast('Project name required'); return; }
                createProject(newName.trim());
                setNewName('');
            };

            const startRename = (p) => { setRenamingId(p.id); setRenameValue(p.name); };
            const commitRename = () => {
                if (renameValue.trim() && renamingId) {
                    renameProject(renamingId, renameValue.trim());
                }
                setRenamingId(null); setRenameValue('');
            };

            // NEW GEMINI INTEGRATION: INSTANT CYBER TEMPLATE SPAWNER
            const handleSpawnTemplate = async () => {
                if (!spawnerIdea.trim()) {
                    showToast("Please supply a template description.");
                    return;
                }
                setSpawnerLoading(true);
                showToast("Architecting application template on Gemini...");
                try {
                    const systemPrompt = "You are the Hypercore App Blueprint Architect. Generate a complete, premium, self-contained interactive single-file application prototype based on the user's instructions. The code must feature responsive design with Tailwind classes, contain mock data or realistic interactivity, look exceptionally high quality, and load all assets inline. Return ONLY the functional HTML inside a single ```html ... ``` markdown block.";
                    const payload = {
                        contents: [{ parts: [{ text: `Generate a fully functional, beautiful, premium single-file HTML prototype for: ${spawnerIdea}. Ensure ample whitespace, rounded corners, interactive states, and responsive styling.` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };
                    const result = await callGeminiWithBackoff(payload);
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    const codeBlockMatch = text?.match(/```html\s*([\s\S]*?)\s*```/i);

                    if (codeBlockMatch && codeBlockMatch[1]) {
                        const targetCode = codeBlockMatch[1];
                        const cleanName = spawnerIdea.toLowerCase().replace(/[^a-z0-9]/g, '_').slice(0, 20) || 'spawned_app';
                        createProject(`✨_${cleanName}`, targetCode);
                        showToast("Template deployed!");
                        setSpawnerIdea('');
                        setActiveTab('ide');
                    } else {
                        showToast("Failed to parse clean application layout.");
                    }
                } catch (err) {
                    showToast("Architect Spawner failed: " + err.message);
                } finally {
                    setSpawnerLoading(false);
                }
            };

            return (
                <div className="h-full overflow-y-auto p-4 sm:p-8 lg:p-12 max-w-6xl mx-auto space-y-8 font-sans safe-x">
                    {/* HERO */}
                    <section className="relative">
                        <div className="absolute -top-10 left-0 right-0 h-[260px] bg-cyan-500/5 blur-[120px] rounded-full -z-10" />
                        <div className="flex items-center gap-3 mb-4">
                            <div className="h-px w-10 bg-cyan-400" />
                            <span className="text-[10px] font-black tracking-[0.5em] text-cyan-400 uppercase">System Active</span>
                            <span className="text-[10px] font-black tracking-[0.4em] text-cyan-700 uppercase mono">{projects.length} PROJECTS</span>
                        </div>
                        <h2 className="text-3xl sm:text-5xl font-black text-white tracking-tighter uppercase leading-[0.92]">
                            Hypercore <br />
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-cyan-500 to-blue-700 glow-text italic">Kernel Manager.</span>
                        </h2>
                        <p className="text-cyan-100/40 text-xs sm:text-sm max-w-xl mt-4 font-medium leading-relaxed uppercase tracking-wide">
                            Central management of application code and AI logic cycles. Deploy production-grade engines instantly via the IDE view.
                        </p>
                        <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3 max-w-2xl">
                            <StatCard label="Projects" value={projects.length} icon="folder" />
                            <StatCard label="Modules" value={modulesCount} icon="layers" />
                            <StatCard label="Active Type" value={codeAnalysis.type} icon="cpu" />
                            <StatCard label="Code Lines" value={codeAnalysis.lines} icon="code" />
                        </div>
                    </section>

                    {/* GEMINI TEMPLATE SPAWNER */}
                    <section className="glass-xray skeletal-border angular-cut p-6 relative overflow-hidden">
                        <div className="absolute -inset-1 bg-gradient-to-r from-cyan-500/10 via-transparent to-cyan-500/10 blur-2xl -z-10" />
                        <div className="flex items-center gap-2 flex-wrap mb-3">
                            <span className="text-[10px] font-black uppercase text-cyan-300 tracking-[0.3em] flex items-center gap-2">
                                <Icon name="sparkles" size={13} className="text-cyan-400" />
                                AI Template Spawner
                            </span>
                            <span className="text-[9px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 border border-cyan-500/30 angular-cut-sm font-black uppercase tracking-widest mono">Gemini Powered</span>
                        </div>
                        <p className="text-xs text-cyan-100/40 mb-4 leading-relaxed">
                            Describe any application (e.g. <em className="text-cyan-300/70">“a visual audio wave synthesizer”</em>, <em className="text-cyan-300/70">“kanban board”</em>) to spawn a new project in the workspace.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <input
                                value={spawnerIdea}
                                onChange={(e) => setSpawnerIdea(e.target.value)}
                                disabled={spawnerLoading}
                                placeholder="INITIALIZE TEMPLATE_QUERY…"
                                className="flex-1 bg-black/60 border border-cyan-500/20 focus:border-cyan-400 angular-cut-sm px-4 py-3 text-sm text-white outline-none placeholder:text-cyan-900 mono tracking-wide"
                            />
                            <button
                                onClick={handleSpawnTemplate}
                                disabled={spawnerLoading || !spawnerIdea.trim()}
                                className="tap-target bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 text-black angular-cut-sm px-5 py-3 text-[11px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-2 transition-all disabled:opacity-40 glow-cyan"
                            >
                                {spawnerLoading ? <Icon name="loader" size={14} /> : <Icon name="zap" size={14} />}
                                Spawn
                            </button>
                        </div>
                    </section>

                    {/* CREATE PROJECT */}
                    <section className="glass-xray skeletal-border angular-cut-sm p-5 flex items-center gap-3 flex-wrap">
                        <Icon name="plus" size={18} className="text-cyan-300" />
                        <input
                            value={newName}
                            onChange={(e) => setNewName(e.target.value)}
                            onKeyDown={(e) => { if (e.key === 'Enter') handleCreate(); }}
                            placeholder="New project name…"
                            className="flex-1 min-w-[200px] bg-black/60 border border-cyan-500/20 focus:border-cyan-400 angular-cut-sm px-3 py-2 text-sm text-white outline-none"
                        />
                        <button onClick={handleCreate} className="tap-target bg-cyan-500 hover:bg-cyan-400 text-black angular-cut-sm px-5 py-2 text-[10px] font-black uppercase tracking-[0.2em] flex items-center gap-2 transition-all">
                            <Icon name="plus" size={12} /> Create
                        </button>
                    </section>

                    {/* PROJECTS GRID */}
                    <section>
                        <h3 className="text-[10px] font-black uppercase tracking-[0.3em] text-cyan-500 mb-4 flex items-center gap-2">
                            <Icon name="database" size={12} className="text-cyan-400" /> Skeletal Vault · Saved Projects ({projects.length})
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {projects.map(p => {
                                const isActive = p.id === currentProjectId;
                                return (
                                    <div
                                        key={p.id}
                                        className={`tool-card angular-cut p-5 flex items-center justify-between transition-all group relative overflow-hidden ${isActive ? 'border-cyan-400 shadow-[0_0_24px_rgba(0,229,255,0.25)]' : ''}`}
                                    >
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-cyan-500/10 blur-[60px] opacity-0 group-hover:opacity-100 transition-opacity" />
                                        <div className="flex items-center gap-4 min-w-0 flex-1 relative z-10">
                                            <div className={`w-12 h-12 angular-cut-sm flex items-center justify-center transition-transform ${isActive ? 'bg-cyan-500 text-black scale-110 glow-cyan' : 'bg-black/60 border border-cyan-500/30 text-cyan-300 group-hover:scale-110'}`}>
                                                <Icon name="code" size={22} />
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                {renamingId === p.id ? (
                                                    <input
                                                        autoFocus
                                                        value={renameValue}
                                                        onChange={(e) => setRenameValue(e.target.value)}
                                                        onBlur={commitRename}
                                                        onKeyDown={(e) => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') { setRenamingId(null); setRenameValue(''); } }}
                                                        className="font-black text-white bg-black border border-cyan-400 angular-cut-sm px-2 py-0.5 text-sm w-full outline-none"
                                                    />
                                                ) : (
                                                    <div className="font-black text-white truncate flex items-center gap-2 uppercase italic tracking-tight">
                                                        {p.name}
                                                        {isActive && <span className="text-[8px] bg-cyan-500 text-black px-1.5 py-0.5 angular-cut-sm font-black uppercase tracking-widest">Active</span>}
                                                    </div>
                                                )}
                                                <div className="text-[10px] text-cyan-700 uppercase tracking-widest flex items-center gap-2 mt-0.5 mono">
                                                    <Icon name="clock" size={9} /> {formatDate(p.updatedAt || p.createdAt)}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-1 opacity-70 group-hover:opacity-100 transition-opacity ml-2 relative z-10">
                                            <button onClick={() => startRename(p)} title="Rename" className="tap-target text-cyan-500/70 hover:text-cyan-100 p-1.5"><Icon name="edit" size={12} /></button>
                                            <button onClick={() => duplicateProject(p.id)} title="Duplicate" className="tap-target text-cyan-500/70 hover:text-cyan-300 p-1.5"><Icon name="copy" size={12} /></button>
                                            <button
                                                onClick={() => {
                                                    triggerConfirmation(
                                                        'Delete Project',
                                                        `Are you sure you want to delete "${p.name}"?`,
                                                        () => deleteProject(p.id)
                                                    );
                                                }}
                                                title="Delete"
                                                className="tap-target text-cyan-700 hover:text-rose-400 p-1.5"
                                            >
                                                <Icon name="trash" size={12} />
                                            </button>
                                            <button
                                                onClick={() => { loadProject(p.id); setActiveTab('ide'); }}
                                                className="tap-target ml-2 bg-cyan-500 hover:bg-cyan-400 text-black angular-cut-sm px-3 py-1.5 text-[9px] font-black uppercase tracking-[0.2em] flex items-center gap-1 transition-all"
                                            >Open <Icon name="chevronRight" size={10} /></button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>
                </div>
            );
        }

        const StatCard = ({ label, value, icon }) => (
            <div className="glass-xray skeletal-border angular-cut-sm p-3 relative overflow-hidden">
                <div className="flex items-center gap-1.5 text-[9px] text-cyan-500/80 uppercase tracking-widest font-black">
                    <Icon name={icon} size={10} className="text-cyan-300" /> {label}
                </div>
                <div className="text-xl font-black text-cyan-50 mt-1 truncate mono glow-text">{value}</div>
            </div>
        );

        function PreviewPage({ code }) {
            return (
                <div className="h-full w-full bg-black relative">
                    <iframe srcDoc={code} className="w-full h-full border-none bg-white" sandbox="allow-scripts allow-modals" />
                    <div className="absolute bottom-4 left-4 glass-xray border border-cyan-500/40 px-3 py-1.5 angular-cut-sm text-[10px] font-black text-cyan-300 flex items-center gap-2 select-none mono uppercase tracking-[0.2em] glow-cyan">
                        <div className="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-xray" /> Realtime X-Ray Render
                    </div>
                </div>
            );
        }

        // ===== COMPONENT: SETTINGS PAGE =====
        function SettingsPage({ settings, setSettings, showToast, projects, modules, conversations, triggerConfirmation, onClearVault, onClearAllConversations }) {
            const toggle = (key) => setSettings({ ...settings, [key]: !settings[key] });

            const exportVault = () => {
                const data = storage.exportAll();
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `hypercore_vault_${Date.now()}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Vault exported');
            };

            const importVault = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.__version !== STORAGE_VERSION) { showToast('Incompatible vault version'); return; }
                        triggerConfirmation(
                            'Import Vault',
                            'Replace local vault with imported data? Current state will be overwritten completely.',
                            () => {
                                localStorage.setItem(STORAGE_KEY, ev.target.result);
                                showToast('Vault imported — reload to apply changes');
                            }
                        );
                    } catch (err) {
                        showToast('Invalid vault file');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const totalConversationTurns = Object.values(conversations || {}).reduce((s, arr) => s + (arr?.length || 0), 0);

            return (
                <div className="h-full overflow-y-auto p-4 sm:p-8 lg:p-12 max-w-3xl mx-auto space-y-8 font-sans safe-x">
                    <div>
                        <div className="flex items-center gap-3 mb-3">
                            <div className="h-px w-10 bg-cyan-400" />
                            <span className="text-[10px] font-black tracking-[0.5em] text-cyan-400 uppercase">Diagnostic Console</span>
                        </div>
                        <h2 className="text-3xl sm:text-4xl font-black text-white uppercase tracking-tighter italic">Kernel <span className="text-cyan-400 glow-text">Configuration</span></h2>
                        <p className="text-cyan-100/40 text-xs mt-2 uppercase tracking-widest">Fine-tune system mechanics, AI integration layers, and sandbox security protocols.</p>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                        <StatCard label="Projects" value={projects.length} icon="folder" />
                        <StatCard label="Modules" value={modules.length} icon="layers" />
                        <StatCard label="Memory Turns" value={totalConversationTurns} icon="message" />
                    </div>

                    <div className="space-y-4">
                        <ToggleRow label="Auto-Format Buffer" checked={settings.autoFormat} onClick={() => toggle('autoFormat')} description="Normalizes bracket levels and visual spaces upon hot-reload saving." />
                        <ToggleRow label="Auto-Save Working Buffer" checked={settings.autoSave} onClick={() => toggle('autoSave')} description="Continuously persists IDE buffer to the active project." />
                        <ToggleRow label="Deep Thinking Mode" checked={settings.deepThinking} onClick={() => toggle('deepThinking')} description="Engages complex reasoning graphs prior to delivering module optimizations." />
                        <ToggleRow label="Encrypted Local Vault" checked={settings.e2eEncryption} onClick={() => toggle('e2eEncryption')} description="Protects local IDE storage layers using AES standard vectors." />
                        <ToggleRow label="Google Search Grounding" checked={settings.grounding} onClick={() => toggle('grounding')} description="Enables Google Search-grounded tools to gather up-to-date documentation on the fly." />
                        <ToggleRow label="Tailored Suggestion Chips" checked={settings.dynamicChips} onClick={() => toggle('dynamicChips')} description="Regenerates chips per code iteration via Gemini for hyper-relevant suggestions. Disable to use static contextual chips." />
                        <ToggleRow label="Agent Conversation Memory" checked={settings.conversationMemory} onClick={() => toggle('conversationMemory')} description="Each agent remembers up to 20 prior turns to deliver coherent multi-step assistance." />
                    </div>

                    <div className="glass-xray skeletal-border angular-cut p-6 space-y-3">
                        <h3 className="text-[10px] font-black uppercase tracking-[0.3em] text-cyan-500 flex items-center gap-2"><Icon name="database" size={12} className="text-cyan-400" /> Local Vault</h3>
                        <p className="text-xs text-cyan-100/50 leading-relaxed">All projects, modules, conversations and settings are stored in your browser. Export to back them up or share between devices.</p>
                        <div className="flex items-center gap-2 flex-wrap">
                            <button onClick={exportVault} className="tap-target bg-black/40 border border-cyan-500/30 hover:border-cyan-400 text-cyan-200 hover:text-cyan-50 px-4 py-2 angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="download" size={12} /> Export</button>
                            <label className="tap-target bg-black/40 border border-cyan-500/30 hover:border-cyan-400 text-cyan-200 hover:text-cyan-50 px-4 py-2 angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center gap-2 cursor-pointer">
                                <Icon name="upload" size={12} /> Import
                                <input type="file" accept=".json,application/json" className="hidden" onChange={importVault} />
                            </label>
                            <button onClick={onClearAllConversations} className="tap-target bg-yellow-950/30 border border-yellow-700/40 hover:border-yellow-500 text-yellow-300 hover:text-yellow-100 px-4 py-2 angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="refresh" size={12} /> Clear Memory</button>
                            <button onClick={onClearVault} className="tap-target bg-rose-950/30 border border-rose-500/40 hover:border-rose-400 text-rose-300 hover:text-rose-100 px-4 py-2 angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="trash" size={12} /> Wipe Vault</button>
                        </div>
                    </div>

                    <div className="glass-xray skeletal-border angular-cut p-6">
                        <h3 className="text-[10px] font-black uppercase tracking-[0.3em] text-cyan-500 mb-4">System Profile</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-[10px] mono">
                            <div><span className="text-cyan-700">Model:</span> <span className="text-cyan-200">{settings.geminiModel}</span></div>
                            <div><span className="text-cyan-700">Storage:</span> <span className="text-cyan-200">v{STORAGE_VERSION}</span></div>
                            <div><span className="text-cyan-700">Auth:</span> <span className="text-cyan-200">ACTIVE</span></div>
                            <div><span className="text-cyan-700">Node:</span> <span className="text-cyan-200">SANDBOX-HC</span></div>
                        </div>
                    </div>
                </div>
            );
        }

        const ToggleRow = ({ label, checked, onClick, description }) => (
            <div className="flex items-center justify-between p-5 glass-xray skeletal-border angular-cut-sm gap-6 hover:border-cyan-500/30 transition-all">
                <div className="min-w-0">
                    <span className="text-sm font-black text-cyan-50 block uppercase tracking-wide">{label}</span>
                    {description && <span className="text-xs text-cyan-100/40 mt-1 block max-w-md leading-relaxed">{description}</span>}
                </div>
                <button onClick={onClick} className={`w-12 h-6 rounded-full relative transition-all shrink-0 ${checked ? 'bg-cyan-500 shadow-[0_0_12px_rgba(0,229,255,0.55)]' : 'bg-black border border-cyan-500/20'}`}>
                    <div className={`absolute top-1 w-4 h-4 rounded-full transition-all ${checked ? 'left-7 bg-black' : 'left-1 bg-cyan-300'}`} />
                </button>
            </div>
        );

        function TabTrigger({ value, icon, label, activeTab, setActiveTab }) {
            const isActive = activeTab === value;
            return (
                <button
                    onClick={() => setActiveTab(value)}
                    className={`tap-target relative my-1 px-4 py-2 angular-cut-sm flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.2em] transition-all ${isActive ? 'bg-cyan-500 text-black glow-cyan' : 'text-cyan-500/70 hover:text-cyan-200 hover:bg-cyan-500/10'}`}
                >
                    <Icon name={icon} size={12} />
                    {label}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
