        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ===== PERSISTENT STORAGE LAYER =====
        const STORAGE_KEY = 'hypercore_state_v4';
        const STORAGE_VERSION = 4;

        const storage = {
            load() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    if (data.__version !== STORAGE_VERSION) return null;
                    return data;
                } catch (err) {
                    console.warn('Storage load failed:', err);
                    return null;
                }
            },
            save(state) {
                try {
                    const payload = { ...state, __version: STORAGE_VERSION, __savedAt: Date.now() };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                    return true;
                } catch (err) {
                    console.warn('Storage save failed:', err);
                    return false;
                }
            },
            clear() {
                try { localStorage.removeItem(STORAGE_KEY); return true; }
                catch (err) { return false; }
            },
            exportAll() {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw || JSON.stringify({ __version: STORAGE_VERSION });
            }
        };

        // ===== CODE CONTEXT ANALYZER =====
        const analyzeCode = (code) => {
            if (!code || typeof code !== 'string') {
                return {
                    isEmpty: true, length: 0, lines: 0, type: 'unknown',
                    libraries: [], features: [], colorPalette: [], summary: 'Empty buffer'
                };
            }
            const lower = code.toLowerCase();
            const lines = code.split('\n').length;
            const libraries = [];
            const features = [];

            // Library detection
            if (lower.includes('three.min.js') || lower.includes('three.module.js') || /\bthree\./i.test(code)) libraries.push('Three.js');
            if (lower.includes('cdn.tailwindcss.com') || /class="[^"]*\b(flex|grid|bg-|text-)/i.test(code)) libraries.push('Tailwind CSS');
            if (lower.includes('react.production') || lower.includes('react.development')) libraries.push('React');
            if (lower.includes('vue.global') || lower.includes('vue.js')) libraries.push('Vue.js');
            if (lower.includes('d3.min.js') || lower.includes('d3.v')) libraries.push('D3.js');
            if (lower.includes('chart.js') || lower.includes('chartjs')) libraries.push('Chart.js');
            if (lower.includes('gsap') || lower.includes('greensock')) libraries.push('GSAP');
            if (lower.includes('p5.min.js') || lower.includes('p5.js')) libraries.push('p5.js');
            if (lower.includes('anime.min.js')) libraries.push('Anime.js');
            if (lower.includes('aframe') || lower.includes('a-frame')) libraries.push('A-Frame');

            // Feature detection
            if (lower.includes('<canvas')) features.push('canvas');
            if (lower.includes('webgl') || lower.includes('webglrenderer')) features.push('webgl');
            if (lower.includes('particle')) features.push('particles');
            if (lower.includes('@keyframes') || lower.includes('animation:')) features.push('animations');
            if (lower.includes('backdrop-filter')) features.push('glassmorphism');
            if (lower.includes('@media')) features.push('responsive');
            if (lower.includes('audio') && (lower.includes('<audio') || lower.includes('audiocontext'))) features.push('audio');
            if (lower.includes('localstorage') || lower.includes('sessionstorage')) features.push('storage');
            if (lower.includes('fetch(') || lower.includes('xmlhttprequest')) features.push('network');
            if (lower.includes('addeventlistener') || lower.includes('onclick')) features.push('interactivity');
            if (lower.includes('form') && lower.includes('<input')) features.push('forms');
            if (lower.includes('svg') && lower.includes('<svg')) features.push('svg');
            if (lower.includes('grid-template') || lower.includes('display: grid') || lower.includes('display:grid')) features.push('css-grid');
            if (lower.includes('flexbox') || lower.includes('display: flex') || lower.includes('display:flex')) features.push('flexbox');
            if (lower.includes('darkmode') || lower.includes('dark-mode')) features.push('dark-mode');
            if (lower.includes('aria-') || lower.includes('role=')) features.push('a11y');
            if (lower.includes('chart') || lower.includes('graph')) features.push('data-viz');
            if (lower.includes('nav') && lower.includes('<nav')) features.push('navigation');
            if (lower.includes('shader') || lower.includes('fragmentshader')) features.push('shaders');

            // Color palette extraction (hex codes)
            const colorMatches = code.match(/#[0-9a-fA-F]{6}\b/g) || [];
            const colorPalette = [...new Set(colorMatches.map(c => c.toLowerCase()))].slice(0, 8);

            // Code type
            let type = 'html-page';
            if (libraries.includes('Three.js')) type = 'webgl-scene';
            else if (libraries.includes('React')) type = 'react-app';
            else if (libraries.includes('Vue.js')) type = 'vue-app';
            else if (features.includes('canvas')) type = 'canvas-graphic';
            else if (features.includes('data-viz')) type = 'data-dashboard';

            const summary = `${type} • ${lines} lines • libs:[${libraries.join(',') || 'none'}] • features:[${features.slice(0,6).join(',') || 'minimal'}]`;

            return {
                isEmpty: false,
                length: code.length,
                lines,
                type,
                libraries,
                features,
                colorPalette,
                summary,
                hasDoctype: lower.includes('<!doctype'),
                hasHead: lower.includes('<head'),
                hasBody: lower.includes('<body'),
                hasScript: lower.includes('<script')
            };
        };

                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);

                // Construct standard 44-byte WAV header
                const header = new ArrayBuffer(44);
                const view = new DataView(header);
                
                view.setUint32(0, 0x52494646, false); // "RIFF"
                view.setUint32(4, 36 + bytes.length, true); // size
                view.setUint32(8, 0x57415645, false); // "WAVE"
                view.setUint32(12, 0x666d7420, false); // "fmt "
                view.setUint32(16, 16, true); // chunk length
                view.setUint16(20, 1, true); // PCM = 1
                view.setUint16(22, 1, true); // Mono = 1
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true); // Byte rate
                view.setUint16(32, 2, true); // Block align
                view.setUint16(34, 16, true); // Bits per sample
                view.setUint32(36, 0x64617461, false); // "data"
                view.setUint32(40, bytes.length, true);

                const wavBytes = new Uint8Array(44 + bytes.length);

                { id: 'm1', type: 'UI', name: 'Glass Card', content: '<div class="glass-xray border border-[rgba(0,229,255,0.20)] p-6 rounded-2xl">{{content}}</div>', tags: ['ui', 'card'], description: 'Frosted glass card container. Use {{content}} for inner HTML.', params: ['content'], createdAt: Date.now() },
                { id: 'm2', type: 'LOGIC', name: 'Smooth Scroll', content: 'window.scrollTo({ top: {{position}}, behavior: "smooth" })', tags: ['scroll', 'helper'], description: 'Scroll to vertical {{position}} smoothly.', params: ['position'], createdAt: Date.now() }
            ]);

            const [settings, setSettings] = useState(() => persisted?.settings || {
                aiAssistant: true,
                geminiModel: 'gemini-2.5-flash-preview-09-2025',
                deepThinking: true,
                grounding: false,
                structuredOutput: true,
                e2eEncryption: true,
                autoFormat: true,
                autoSave: true,
                dynamicChips: true,
                conversationMemory: true
            });

            const [conversations, setConversations] = useState(() => persisted?.conversations || {
                code: [], debug: [], design: [], architect: []
            });

            const [actionLog, setActionLog] = useState(() => persisted?.actionLog || []);

            const [dynamicChips, setDynamicChips] = useState(() => {
                const analysis = analyzeCode(currentProject?.content || DEFAULT_THREE_CODE);
                return getStaticChips(analysis).map(c => ({ ...c, dynamic: false }));
            });
            const [chipsLoading, setChipsLoading] = useState(false);

            const showToast = (msg) => {
                setToastMsg(msg);
                setToastOpen(true);
            };

            const codeAnalysis = useMemo(() => analyzeCode(code), [code]);

            // Clean up running narrations when changing projects or tabs
            useEffect(() => {
                if (activeAudio) {
                    activeAudio.pause();
                    setActiveAudio(null);
                }
            }, [currentProjectId, activeTab]);

            // ---- Sync and auto-save ----
            useEffect(() => {
                if (!isAuthenticated) return;
                const id = setTimeout(() => {
                    storage.save({
                        projects, currentProjectId, modules, settings,
                        conversations: settings.conversationMemory ? conversations : { code: [], debug: [], design: [], architect: [] },
                        actionLog: actionLog.slice(0, 50)
                    });
                }, 400);
                return () => clearTimeout(id);
            }, [projects, currentProjectId, modules, settings, conversations, actionLog, isAuthenticated]);

            useEffect(() => {
                if (!settings.autoSave || !isAuthenticated) return;
                const id = setTimeout(() => {
                    setProjects(prev => prev.map(p =>
                        p.id === currentProjectId ? { ...p, content: code, updatedAt: Date.now() } : p
                    ));
                }, 800);
                return () => clearTimeout(id);
            }, [code, currentProjectId, settings.autoSave, isAuthenticated]);

            useEffect(() => {
                if (!isAuthenticated || !settings.dynamicChips) return;
                let cancelled = false;
                const id = setTimeout(async () => {
                    setChipsLoading(true);
                    const chips = await generateContextualChips(code, codeAnalysis, actionLog);
                    if (!cancelled) {
                        setDynamicChips(chips);
                        setChipsLoading(false);
                    }
                }, 1500);
                return () => { cancelled = true; clearTimeout(id); setChipsLoading(false); };
            }, [code, isAuthenticated, settings.dynamicChips]);

            const updateCodeWithHistory = (newCodeOrFn, actionLabel) => {
                setCode(prevCode => {
                    const newCode = typeof newCodeOrFn === 'function' ? newCodeOrFn(prevCode) : newCodeOrFn;
                    setCodeHistory(h => [prevCode, ...h].slice(0, 20));
                    return newCode;
                });
                if (actionLabel) {
                    setActionLog(prev => [actionLabel, ...prev].slice(0, 50));
                }
            };

            const triggerUndo = () => {
                if (codeHistory.length > 0) {
                    const previous = codeHistory[0];
                    setCode(previous);
                    setCodeHistory(prev => prev.slice(1));
                    showToast("Reverted last AI modification");
                }
            };

            // ---- Audio Narration Handler ----
            const playIntelligenceBriefing = async () => {
                if (activeAudio) {
                    activeAudio.pause();
                    setActiveAudio(null);
                    showToast("Audio Briefing Paused");
                    return;
                }

                setAudioLoading(true);
                showToast("Generating intelligence briefing voice feed...");

                try {
                    // Let LLM generate a short narration script of the code
                    const payload = {
                        contents: [{ parts: [{ text: `Analyze this code context: [${codeAnalysis.summary}]. Write a concise, 1-2 sentence futuristic sci-fi narrator walkthrough describing the application structure and indicating readiness for compile.` }] }]
                    };
                    const textResult = await callGeminiWithBackoff(payload);
                    const briefText = textResult.candidates?.[0]?.content?.parts?.[0]?.text || "Hypercore initialization complete. Ready for manual compile instruction.";

                    // Call the Gemini TTS endpoint
                    const voiceBase64 = await callGeminiTTS(`Say in a professional futuristic tone: ${briefText}`, selectedVoice);
                    
                    // Render and play
                    const audioRef = playPCM16(voiceBase64, 24000);
                    setActiveAudio(audioRef);
                    showToast("Voiced broadcast active");
                } catch (err) {
                    showToast("Audio transmission failed: " + err.message);
                } finally {
                    setAudioLoading(false);
                }
            };

            // ---- Project Operations ----
            const createProject = (name, initialContent) => {
                const id = 'p_' + Date.now();
                const proj = {
                    id, name: name || 'untitled',
                    content: initialContent || '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <title>New Project</title>\n</head>\n<body>\n  <h1>Hello, Hypercore</h1>\n</body>\n</html>',
                    createdAt: Date.now(), updatedAt: Date.now()
                };
                setProjects(prev => [proj, ...prev]);
                setCurrentProjectId(id);
                setCode(proj.content);
                setCodeHistory([]);
                showToast(`Project "${proj.name}" created`);
                return id;
            };

            const loadProject = (id) => {
                const p = projects.find(x => x.id === id);
                if (!p) return;
                setProjects(prev => prev.map(x => x.id === currentProjectId ? { ...x, content: code, updatedAt: Date.now() } : x));
                setCurrentProjectId(id);
                setCode(p.content);
                setCodeHistory([]);
                showToast(`Loaded "${p.name}"`);
            };

            const deleteProject = (id) => {
                if (projects.length === 1) { showToast('At least one project must remain'); return; }
                const remaining = projects.filter(p => p.id !== id);
                setProjects(remaining);
                if (currentProjectId === id) {
                    setCurrentProjectId(remaining[0].id);
                    setCode(remaining[0].content);
                    setCodeHistory([]);
                }
                showToast('Project deleted');
            };

            const renameProject = (id, name) => {
                setProjects(prev => prev.map(p => p.id === id ? { ...p, name, updatedAt: Date.now() } : p));
                showToast('Project renamed');
            };

            const duplicateProject = (id) => {
                const p = projects.find(x => x.id === id);
                if (!p) return;
                const copy = { ...p, id: 'p_' + Date.now(), name: p.name + ' (copy)', createdAt: Date.now(), updatedAt: Date.now() };
                setProjects(prev => [copy, ...prev]);
                showToast(`Duplicated "${p.name}"`);
            };

            const forceSave = () => {
                setProjects(prev => prev.map(p => p.id === currentProjectId ? { ...p, content: code, updatedAt: Date.now() } : p));
                storage.save({
                    projects: projects.map(p => p.id === currentProjectId ? { ...p, content: code, updatedAt: Date.now() } : p),
                    currentProjectId, modules, settings, conversations, actionLog: actionLog.slice(0, 50)

            };

            const appendConversation = (agentKey, entry) => {
                if (!settings.conversationMemory) return;
                setConversations(prev => ({
                    ...prev,
                    [agentKey]: [...(prev[agentKey] || []), entry].slice(-20)

            };

            const clearConversation = (agentKey) => {
                setConversations(prev => ({ ...prev, [agentKey]: [] }));
            };

            useEffect(() => {
                if (toastOpen) {

                    return () => clearTimeout(timer);

            // Keyboard Shortcuts
            useEffect(() => {
                if (!isAuthenticated) return;
                const onKey = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); forceSave(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && activeTab === 'ide') {
                        const target = e.target;
                        if (target && (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT')) return;
                        e.preventDefault(); triggerUndo();
                    }

                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);

            const TABS = [

                { id: 'modules',   icon: 'layers',    label: 'Modules' },

            return (
                <div className="h-screen w-full text-slate-300 flex flex-col font-sans selection:bg-cyan-500/30 overflow-hidden relative xray-grid">
                    {/* Global X-Ray scan line overlay */}
                    {isAuthenticated && <div className="scan-line" />}

                    {!isAuthenticated ? (
                        <AuthPage onLogin={() => { setIsAuthenticated(true); showToast("Access Granted"); }} hasVault={!!persisted} />
                    ) : (
                        <div className="flex-grow flex flex-col h-full w-full overflow-hidden">
                            {/* === X-RAY HEADER === */}
                            <header className="glass-xray skeletal-border border-x-0 border-t-0 safe-top safe-x shrink-0 z-[60] relative">
                                <div className="flex items-center justify-between px-4 sm:px-6 h-16">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <div className="w-10 h-10 bg-cyan-500 angular-cut flex items-center justify-center text-black glow-cyan cursor-pointer hover:rotate-6 transition-all shrink-0">
                                            <Icon name="binary" size={20} />
                                        </div>
                                        <div className="flex flex-col min-w-0">
                                            <span className="text-base sm:text-lg font-black tracking-tighter text-white uppercase italic leading-none truncate">
                                                Hyper<span className="text-cyan-400 glow-text">Core</span>
                                            </span>
                                            <span className="text-[8px] tracking-[0.35em] text-cyan-500/70 font-bold uppercase mt-0.5 mono">X-RAY ENGINE v6.9</span>
                                        </div>
                                        <div className="hidden lg:flex items-center gap-2 ml-4 px-3 py-1.5 bg-black/40 border border-cyan-500/15 angular-cut-sm">
                                            <Icon name="folder" size={11} className="text-cyan-400" />
                                            <span className="text-[9px] font-bold text-cyan-200/80 uppercase tracking-widest truncate max-w-[160px] mono">{currentProject?.name || 'untitled'}</span>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 sm:gap-3">
                                        {!networkOnline && (
                                            <span className="hidden sm:flex items-center gap-1 text-[9px] uppercase tracking-widest text-rose-400 font-bold mono">
                                                <Icon name="wifiOff" size={11} /> OFFLINE
                                            </span>
                                        )}

                                        {/* Voice briefing setup */}
                                        <div className="hidden md:flex items-center gap-2 bg-black/40 border border-cyan-500/20 angular-cut-sm px-2 py-1">
                                            <select
                                                value={selectedVoice}
                                                onChange={(e) => setSelectedVoice(e.target.value)}
                                                className="bg-transparent text-[9px] font-black uppercase text-cyan-300/80 focus:outline-none cursor-pointer mono"
                                                title="Audio Narrator Prebuilt Voice Profile"
                                            >
                                                <option value="Kore" className="bg-black">Kore</option>
                                                <option value="Fenrir" className="bg-black">Fenrir</option>
                                                <option value="Zephyr" className="bg-black">Zephyr</option>
                                                <option value="Autonoe" className="bg-black">Autonoe</option>
                                            </select>
                                            <button
                                                onClick={playIntelligenceBriefing}
                                                disabled={audioLoading}
                                                className={`flex items-center gap-1.5 text-[10px] font-bold uppercase py-0.5 px-2 angular-cut-sm transition-all ${activeAudio ? 'bg-rose-950 text-rose-300' : 'text-cyan-300 hover:bg-cyan-500/15 hover:text-cyan-100'}`}
                                                title="Voice overview of current code buffer"
                                            >
                                                {audioLoading ? <Icon name="loader" size={11} /> : <Icon name="volume" size={11} />}
                                                {activeAudio ? 'Stop' : '✨ Narrate'}
                                            </button>
                                        </div>

                                        <button
                                            onClick={() => setIsAgentOpen(!isAgentOpen)}
                                            className={`tap-target hidden sm:flex px-3 py-2 angular-cut-sm text-[10px] font-black uppercase tracking-[0.2em] border transition-all items-center gap-2 ${isAgentOpen ? 'bg-cyan-500 border-cyan-400 text-black glow-cyan' : 'border-cyan-500/30 text-cyan-300 hover:text-cyan-100 hover:bg-cyan-500/10'}`}
                                        >
                                            <Icon name="sparkles" size={12} /> Intel Hub
                                        </button>
                                        <button
                                            onClick={() => setIsAuthenticated(false)}
                                            className="hidden sm:block text-[10px] font-bold text-cyan-500/70 hover:text-cyan-200 uppercase tracking-widest transition-colors"
                                            title="Sever connection"
                                        >
                                            Logout
                                        </button>
                                        <button onClick={() => setMobileMenu(!mobileMenu)} className="tap-target sm:hidden text-cyan-300 flex items-center justify-center">
                                            <Icon name={mobileMenu ? 'x' : 'menu'} size={22} />
                                        </button>
                                    </div>
                                </div>

                                {/* Mobile menu drawer */}
                                {mobileMenu && (
                                    <div className="sm:hidden border-t border-cyan-500/20 fade-in">
                                        <div className="px-4 py-3 grid grid-cols-2 gap-2">
                                            {TABS.map(t => (
                                                <button
                                                    key={t.id}
                                                    onClick={() => { setActiveTab(t.id); setMobileMenu(false); }}
                                                    className={`tap-target px-3 py-3 text-[10px] font-black uppercase tracking-widest flex items-center gap-2 angular-cut-sm transition-all ${activeTab === t.id ? 'bg-cyan-500 text-black' : 'bg-black/40 border border-cyan-500/20 text-cyan-300'}`}
                                                >
                                                    <Icon name={t.icon} size={12} /> {t.label}
                                                </button>
                                            ))}
                                            <button
                                                onClick={() => { setIsAgentOpen(true); setMobileMenu(false); }}
                                                className="tap-target col-span-2 px-3 py-3 bg-cyan-500 text-black angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 glow-cyan"
                                            >
                                                <Icon name="sparkles" size={12} /> Intelligence Hub
                                            </button>
                                            <button
                                                onClick={playIntelligenceBriefing}
                                                disabled={audioLoading}
                                                className={`tap-target px-3 py-3 angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 ${activeAudio ? 'bg-rose-950 text-rose-300 border border-rose-500/40' : 'bg-black/40 border border-cyan-500/20 text-cyan-300'}`}
                                            >
                                                {audioLoading ? <Icon name="loader" size={12} /> : <Icon name="volume" size={12} />}
                                                {activeAudio ? 'Stop Narrator' : 'Narrate'}
                                            </button>
                                            <button
                                                onClick={() => { setIsAuthenticated(false); setMobileMenu(false); }}
                                                className="tap-target px-3 py-3 angular-cut-sm text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 border border-rose-500/30 text-rose-300"
                                            >
                                                <Icon name="x" size={12} /> Logout
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </header>

                            {/* === X-RAY TAB BAR === */}
                            <div className="hidden sm:flex items-center px-4 gap-2 glass-xray border-b border-cyan-500/20 shrink-0 z-50 overflow-x-auto safe-x">
                                {TABS.map(t => (
                                    <TabTrigger key={t.id} value={t.id} activeTab={activeTab} setActiveTab={setActiveTab} icon={t.icon} label={t.label} />
                                ))}
                                <div className="ml-auto flex items-center gap-1 text-[9px] text-cyan-500/60 mono uppercase tracking-widest pr-2">
                                    <div className={`w-1.5 h-1.5 rounded-full ${networkOnline ? 'bg-cyan-400 animate-pulse' : 'bg-rose-500'}`} />
                                    HC-{activeTab.toUpperCase()}
                                </div>
                            </div>

                            <main className="flex-1 relative overflow-hidden flex">
                                <div className="flex-1 h-full overflow-hidden">
                                    {activeTab === 'dashboard' && (
                                        <DashboardPage
                                            projects={projects}
                                            currentProjectId={currentProjectId}
                                            loadProject={loadProject}
                                            createProject={createProject}
                                            deleteProject={deleteProject}
                                            renameProject={renameProject}
                                            duplicateProject={duplicateProject}
                                            setActiveTab={setActiveTab}
                                            codeAnalysis={codeAnalysis}
                                            modulesCount={modules.length}
                                            showToast={showToast}
                                            triggerConfirmation={triggerConfirmation}
                                        />
                                    )}
                                    {activeTab === 'ide' && (
                                        <IDEPage
                                            code={code}
                                            setCode={setCode}
                                            applyAICode={(c, label) => updateCodeWithHistory(c, label)}
                                            showToast={showToast}
                                            settings={settings}
                                            triggerUndo={triggerUndo}
                                            hasHistory={codeHistory.length > 0}
                                            dynamicChips={dynamicChips}
                                            chipsLoading={chipsLoading}
                                            codeAnalysis={codeAnalysis}
                                            forceSave={forceSave}
                                            actionLog={actionLog}
                                            currentProject={currentProject}
                                            onActionLog={(a) => setActionLog(prev => [a, ...prev].slice(0, 50))}
                                            playBriefing={playIntelligenceBriefing}
                                            audioLoading={audioLoading}
                                            activeAudio={activeAudio}
                                        />
                                    )}
                                    {activeTab === 'preview' && <PreviewPage code={code} />}
                                    {activeTab === 'modules' && (
                                        <ModuleBuilder
                                            modules={modules}
                                            setModules={setModules}
                                            showToast={showToast}
                                            applyAICode={(c, label) => updateCodeWithHistory(c, label)}
                                            setActiveTab={setActiveTab}
                                            code={code}
                                            triggerConfirmation={triggerConfirmation}
                                        />
                                    )}
                                    {activeTab === 'settings' && (
                                        <SettingsPage
                                            settings={settings}
                                            setSettings={setSettings}
                                            showToast={showToast}
                                            projects={projects}
                                            modules={modules}
                                            conversations={conversations}
                                            triggerConfirmation={triggerConfirmation}
                                            onClearVault={() => {
                                                triggerConfirmation(
                                                    'Clear Vault Data',
                                                    'Erase ALL local data (projects, modules, conversations)? This action cannot be undone.',
                                                    () => {
                                                        storage.clear();
                                                        showToast('Local vault cleared — reload to apply changes');
                                                    }
                                                );
                                            }}
                                            onClearAllConversations={() => {
                                                setConversations({ code: [], debug: [], design: [], architect: [] });
                                                showToast('Conversation memory cleared');
                                            }}
                                        />
                                    )}
                                </div>

                                {/* Intelligence Sidebar */}
                                <AgentSidebar
                                    isOpen={isAgentOpen}
                                    onClose={() => setIsAgentOpen(false)}
                                    code={code}
                                    applyAICode={(c, label) => updateCodeWithHistory(c, label)}
                                    showToast={showToast}
                                    settings={settings}
                                    codeAnalysis={codeAnalysis}
                                    conversations={conversations}
                                    appendConversation={appendConversation}
                                    clearConversation={clearConversation}
                                    actionLog={actionLog}
                                    selectedVoice={selectedVoice}
                                />
                            </main>

                            <footer className="glass-xray skeletal-border border-x-0 border-b-0 safe-bottom safe-x shrink-0">
                                <div className="h-10 px-4 sm:px-6 flex items-center justify-between text-[9px] font-bold uppercase tracking-[0.25em] text-cyan-500/70 mono">
                                    <div className="flex items-center gap-3 sm:gap-4">
                                        <span className="flex items-center gap-2"><div className={`w-1.5 h-1.5 rounded-full ${networkOnline ? 'bg-cyan-400 animate-xray' : 'bg-rose-500'}`} /> Multicore</span>
                                        <span className="hidden sm:flex items-center gap-2"><div className="w-1.5 h-1.5 bg-cyan-300 rounded-full" /> {settings.geminiModel}</span>
                                        <span className="hidden md:flex items-center gap-2"><div className="w-1.5 h-1.5 bg-emerald-400 rounded-full" /> {codeAnalysis.type} · {codeAnalysis.lines}L</span>
                                    </div>
                                    <span className="truncate text-cyan-600">VAULT · {projects.length} PROJ · {modules.length} MOD · NODE :: SANDBOX-HC</span>
                                </div>
                            </footer>
                        </div>
                    )}
                    <Toast message={toastMsg} isOpen={toastOpen} onClose={() => setToastOpen(false)} />

                    {/* INTERACTIVE CUSTOM HANDSHAKE / X-RAY CONFIRMATION MODAL */}
                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 modal-backdrop z-[300] flex items-center justify-center p-4 fade-in font-sans safe-x">
                            <div className="glass-xray skeletal-border angular-cut w-full max-w-md p-6 shadow-2xl glow-cyan relative overflow-hidden">
                                <div className="scan-line" />
                                <h3 className="text-sm font-black uppercase tracking-[0.2em] text-cyan-50 mb-2 flex items-center gap-2 glow-text">
                                    <Icon name="alert" size={16} className="text-cyan-400" />
                                    {confirmModal.title || 'System Confirmation'}
                                </h3>
                                <p className="text-xs text-cyan-100/60 mb-6 leading-relaxed">{confirmModal.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button
                                        onClick={() => setConfirmModal({ ...confirmModal, isOpen: false })}
                                        className="tap-target text-[10px] font-bold uppercase tracking-widest text-cyan-500/70 hover:text-cyan-100 px-4 py-2"
                                    >
                                        Abort
                                    </button>
                                    <button
                                        onClick={() => {
                                            if (confirmModal.onConfirm) confirmModal.onConfirm();
                                            setConfirmModal({ ...confirmModal, isOpen: false });
                                        }}
                                        className="tap-target bg-rose-700 hover:bg-rose-600 text-white px-5 py-2 angular-cut-sm text-[10px] font-bold uppercase tracking-widest"
                                    >
                                        Execute
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ===== COMPONENT: MULTI-AGENT SIDEBAR =====
        function AgentSidebar({ isOpen, onClose, code, applyAICode, showToast, settings, codeAnalysis, conversations, appendConversation, clearConversation, actionLog, selectedVoice }) {
            const [selectedAgent, setSelectedAgent] = useState('code');
            const [prompt, setPrompt] = useState('');
            const [isBusy, setIsBusy] = useState(false);
            const [agentResponse, setAgentResponse] = useState('');
            const [generatedCode, setGeneratedCode] = useState('');
            const [imageRef, setImageRef] = useState(null);
            const [showHistory, setShowHistory] = useState(false);
            const fileInputRef = useRef(null);

            const agents = {
                code: {
                    name: 'Code Agent',
                    icon: 'code',
                    color: '#00e5ff',
                    desc: 'Full-stack software construction',
                    systemPrompt: 'You are the Hypercore Code Agent. You specialize in generating fully runnable, pristine HTML code combining interactive structures, responsive Tailwind UI, and standard Javascript/Three.js libraries. When requested to edit or generate code, output the explanation followed by the exact code block in ```html...```.'
                },
                debug: {
                    name: 'Debug Agent',
                    icon: 'bug',
                    color: '#9f1239',
                    desc: 'Error isolation & fix logic',
                    systemPrompt: 'You are the Hypercore Debug Agent. Analyze the provided source code for logic issues, missing components, bracket misalignments, or browser console bugs. Detail the issues clearly, provide recommendations, and output a corrected full source block in ```html...```.'
                },
                design: {
                    name: 'Design Agent',
                    icon: 'pen',
                    color: '#f1e05a',
                    desc: 'UI/UX & aesthetic polish',
                    systemPrompt: 'You are the Hypercore Design Agent. Improve CSS setups, inject futuristic glassmorphism themes, apply balanced layouts with Tailwind, design modern palettes, and elevate visual excellence. Output the explanation and modernized code block inside ```html...```.'
                },
                architect: {
                    name: 'Architect Agent',
                    icon: 'box',
                    color: '#67e8f9',
                    desc: 'Scalable structural patterns',
                    systemPrompt: 'You are the Hypercore Architect Agent. Analyze codebase scalability, recommend modular structural patterns, map clean application states, and provide architectural blueprints. Output detailed explanations.'
                }
            };

            const currentHistory = conversations[selectedAgent] || [];

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {

        // ===== MODULE EDITOR MODAL =====
        function ModuleEditorModal({ module, onClose, onSave, onDelete, showToast, triggerConfirmation }) {
            const [draft, setDraft] = useState(module);
            const [tagInput, setTagInput] = useState('');

            useEffect(() => setDraft(module), [module]);
            if (!module) return null;

            const detectedParams = useMemo(() => {
                const matches = [...(draft.content || '').matchAll(/\{\{(\w+)\}\}/g)];
                return [...new Set(matches.map(m => m[1]))];
            }, [draft.content]);

            const handleSave = () => {
                if (!draft.name?.trim()) { showToast('Module name required'); return; }
                onSave({ ...draft, params: detectedParams, updatedAt: Date.now() });
                onClose();
            };

            const addTag = () => {
                const t = tagInput.trim().toLowerCase();
                if (t && !(draft.tags || []).includes(t)) {
                    setDraft({ ...draft, tags: [...(draft.tags || []), t] });
                }
                setTagInput('');
            };

            return (
                <div className="fixed inset-0 modal-backdrop z-[150] flex items-center justify-center p-4 fade-in font-sans">
                    <div className="bg-[#0a0c10] border border-[rgba(0,229,255,0.20)] rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div className="p-5 border-b border-[rgba(0,229,255,0.20)] flex items-center justify-between sticky top-0 bg-[#0a0c10] z-10">
                            <h3 className="text-sm font-black uppercase tracking-widest text-white flex items-center gap-2">
                                <Icon name="edit" size={16} className="text-[#67e8f9]" />
                                {module.id?.startsWith('new_') ? 'New Module' : 'Edit Module'}
                            </h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-white"><Icon name="x" size={20} /></button>
                        </div>

                        <div className="p-6 space-y-5">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Name</label>
                                    <input
                                        value={draft.name || ''}
                                        onChange={(e) => setDraft({ ...draft, name: e.target.value })}
                                        className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#00e5ff] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Type</label>
                                    <select
                                        value={draft.type || 'UI'}
                                        onChange={(e) => setDraft({ ...draft, type: e.target.value })}
                                        className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#00e5ff] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                    >
                                        <option value="UI">UI</option>
                                        <option value="LOGIC">LOGIC</option>
                                        <option value="AI-PROMPT">AI-PROMPT</option>
                                        <option value="LAYOUT">LAYOUT</option>
                                        <option value="ANIMATION">ANIMATION</option>
                                        <option value="DATA">DATA</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Description</label>
                                <input
                                    value={draft.description || ''}
                                    onChange={(e) => setDraft({ ...draft, description: e.target.value })}
                                    placeholder="What does this module do?"
                                    className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#00e5ff] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                />
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2 flex items-center justify-between">
                                    <span>Content / Template</span>

                                    value={draft.content || ''}

                                />
                                {detectedParams.length > 0 && (
                                    <div className="mt-2 flex items-center gap-2 flex-wrap">
                                        <span className="text-[9px] text-gray-500 uppercase tracking-widest font-bold">Detected params:</span>
                                        {detectedParams.map(p => (
                                            <span key={p} className="text-[10px] bg-[#00e5ff]/20 border border-[#00e5ff]/40 text-cyan-200 px-2 py-0.5 rounded mono">{p}</span>

                                <button 
                                    onClick={() => { 
                                        triggerConfirmation(
                                            'Delete Module',
                                            `Are you sure you want to delete "${draft.name}"?`,
                                            () => { onDelete(module.id); onClose(); }
                                        );
                                    }} 
                                    className="text-[10px] font-bold uppercase tracking-widest text-red-500 hover:text-red-300 flex items-center gap-1"
                                >
                                    <Icon name="trash" size={12} /> Delete
                                </button>
                            )}
                            <div className="flex items-center gap-3 ml-auto">
                                <button onClick={onClose} className="text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-white px-4 py-2">Cancel</button>

                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== INSTANTIATE-PARAMETERS MODAL =====
        function InstantiateModal({ module, onClose, onInject, showToast }) {
            const [values, setValues] = useState({});
            if (!module) return null;
            const params = module.params || [];

            const resolved = useMemo(() => {
                let out = module.content || '';
                params.forEach(p => {
                    const v = values[p] !== undefined ? values[p] : '';
                    out = out.split(`{{${p}}}`).join(v);
                });
                return out;
            }, [module, values, params]);

            return (
                <div className="fixed inset-0 modal-backdrop z-[150] flex items-center justify-center p-4 fade-in font-sans">
                    <div className="bg-[#0a0c10] border border-[rgba(0,229,255,0.20)] rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">

                            <h3 className="text-sm font-black uppercase tracking-widest text-white flex items-center gap-2">
                                <Icon name="zap" size={16} className="text-[#67e8f9]" /> Instantiate "{module.name}"
                            </h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-white"><Icon name="x" size={20} /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            {params.length === 0 ? (
                                <p className="text-xs text-gray-500 italic">This module has no parameters — it will be injected as-is.</p>
                            ) : (
                                params.map(p => (
                                    <div key={p}>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2 mono">{`{{${p}}}`}</label>
                                        <input
                                            value={values[p] || ''}
                                            onChange={(e) => setValues({ ...values, [p]: e.target.value })}
                                            className="w-full bg-black border border-[rgba(0,229,255,0.20)] focus:border-[#00e5ff] rounded-lg px-3 py-2 text-sm text-white outline-none"
                                        />
                                    </div>
                                ))
                            )}
                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Preview</label>
                                <pre className="bg-black border border-[rgba(0,229,255,0.20)] rounded-lg p-3 text-[10px] text-gray-300 mono overflow-x-auto max-h-40">{resolved}</pre>
                            </div>
                        </div>
                        <div className="p-5 border-t border-[rgba(0,229,255,0.20)] flex items-center justify-end gap-3">
                            <button onClick={onClose} className="text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-white px-4 py-2">Cancel</button>
                            <button
                                onClick={() => { onInject(resolved); onClose(); }}
                                className="bg-[#0891b2] hover:bg-[#00e5ff] text-white px-5 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2"

        // ===== GEMINI PROMPT ENGINE MODAL (Module Generator) =====

            const [includeComments, setIncludeComments] = useState(true);
            const [responsive, setResponsive] = useState(true);

            const presets = {

                    'Animated stat card with glowing border',
                    'Pricing table with 3 tiers and highlighted plan',
                    'Hero section with gradient text and CTA button',
                    'Notification toast with icon and dismiss button'
                ],
                'LOGIC': [
                    'Debounced search input handler',
                    'LocalStorage wrapper with TTL expiration',
                    'Fetch helper with retry and exponential backoff',
                    'Event bus / pub-sub mini system'
                ],
                'AI-PROMPT': [
                    'Code reviewer that critiques security issues',
                    'Marketing copy generator for a SaaS product',
                    'JSON data extractor from unstructured text',
                    'Persona-based chatbot system prompt'
                ],
                'LAYOUT': [
                    'Dashboard grid with sidebar and topbar',
                    'Responsive 3-column feature section',
                    'Split-screen login layout',
                    'Sticky footer page shell'
                ],
                'ANIMATION': [
                    'Pulse glow effect for buttons',
                    'Scroll-reveal fade-up animation',
                    'Marquee scrolling text strip',
                    'Loading skeleton shimmer'
                ],

                    'Mock user dataset (10 entries) as JSON',
                    'CSV-to-JSON parser snippet',
                    'Schema for an e-commerce product',
                    'GraphQL query template for posts'
